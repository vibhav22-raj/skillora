services:
  - type: web
    name: skillora-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: AI_PROVIDER
        value: groq
      - key: DEMO_MODE
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: AI_API_KEY
        sync: false
