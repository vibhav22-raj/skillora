services:
  - type: web
    name: skillora-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DEMO_MODE
        value: true
      - key: JWT_SECRET
        generateValue: true
      - key: AI_PROVIDER
        value: demo
